<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovusFunds | Refund Request Portal</title>
    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: #151f32;
            --primary-accent: #38bdf8;
            --primary-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .logo span {
            color: var(--primary-accent);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--primary-accent);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.875rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 1.5rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 1rem;
        }

        .success-icon {
            font-size: 3rem;
            color: var(--success-color);
            margin-bottom: 1rem;
        }

        .success-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="form-container">
            <div class="header">
                <div class="logo">Novus<span>Funds</span></div>
                <p class="subtitle">Submit your refund request securely below.</p>
            </div>

            <form id="refundForm" action="https://formspree.io/f/xoevprdy" method="POST" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="Full Name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="Email Address" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="transactionId">Transaction / Reference ID</label>
                    <input type="text" id="transactionId" name="Transaction ID" required placeholder="TXN-12345678">
                </div>

                <div class="form-group">
                    <label for="reason">Reason for Refund</label>
                    <select id="reason" name="Reason" required>
                        <option value="" disabled selected>Select a reason</option>
                        <option value="Accidental Charge">Accidental Charge</option>
                        <option value="Duplicate Payment">Duplicate Payment</option>
                        <option value="Service Dissatisfaction">Service Dissatisfaction</option>
                        <option value="Other Reason">Other Reason</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="details">Additional Details</label>
                    <textarea id="details" name="Additional Details" placeholder="Please provide any extra context..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn">Submit Request</button>
            </form>
        </div>

        <div id="success-container" class="success-message">
            <div class="success-icon">✓</div>
            <h2 class="success-title">Request Received</h2>
            <p class="subtitle">Thank you. Your refund request has been securely submitted to NovusFunds. We will review your case shortly.</p>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Submitting...';
            btn.disabled = true;

            const form = event.target;
            const data = new FormData(form);
            
            // Attempt AJAX background submission
            fetch(form.action, {
                method: form.method,
                body: data,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    showSuccess();
                } else {
                    // Fallback: If API returns an error status due to local configurations, force browser native submission form post safely.
                    form.submit();
                }
            }).catch(error => {
                // Network block/SSL issue completely caught here. 
                // We fallback smoothly by submitting directly via native HTML form post which forces the browser to handle the data transmission bypass.
                form.submit();
            });
        }

        function showSuccess() {
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('success-container').style.display = 'block';
        }
    </script>

</body>
</html>
